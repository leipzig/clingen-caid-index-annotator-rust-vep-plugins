[package]
name = "clingen-index"
version = "0.1.0"
description = "Regenerate the ClinGen Allele Registry CA-ID index: query windows, Registry enumeration and lookup, the GRCh38 genome, the index build, and the validate and reach checks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clingen-allele = { path = "../clingen-allele" }
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "=3.4.3"
vareffect = "=0.6.0"

[dev-dependencies]
assert_cmd = "2"
clingen-allele = { path = "../clingen-allele", features = ["test-support"] }
tempfile = "3"
